name: Production Maintenance

on:
  schedule:
    - cron: "13 8 * * *"
    - cron: "43 9 1 * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Maintenance operation to run
        required: true
        default: both
        type: choice
        options:
          - both
          - backup
          - restore

permissions:
  contents: read
  issues: write

concurrency:
  group: production-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEASON: "2025-26"
      LIVE_API_URL: ${{ vars.LIVE_API_URL }}
      AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      AWS_S3_BUCKET_NAME: ${{ vars.AWS_S3_BUCKET_NAME }}
      AWS_S3_URL_STYLE: ${{ vars.AWS_S3_URL_STYLE }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Select scheduled operation
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
        run: |
          backup=false
          restore=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$REQUESTED_OPERATION" in
              backup) backup=true ;;
              restore) restore=true ;;
              both) backup=true; restore=true ;;
              *) echo "Unsupported operation: $REQUESTED_OPERATION"; exit 2 ;;
            esac
          elif [ "$SCHEDULE" = "13 8 * * *" ]; then
            backup=true
          elif [ "$SCHEDULE" = "43 9 1 * *" ]; then
            restore=true
          else
            echo "Unknown schedule: $SCHEDULE"
            exit 2
          fi
          echo "backup=$backup" >> "$GITHUB_OUTPUT"
          echo "restore=$restore" >> "$GITHUB_OUTPUT"

      - name: Validate maintenance configuration
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          test -n "$LIVE_API_URL"
          test -n "$AWS_ENDPOINT_URL"
          test -n "$AWS_DEFAULT_REGION"
          test -n "$AWS_S3_BUCKET_NAME"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          if [ "${{ steps.mode.outputs.backup }}" = "true" ]; then
            test -n "$PRODUCTION_DATABASE_URL"
          fi

      - name: Install PostgreSQL 18 client for backup validation
        if: steps.mode.outputs.backup == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          # Installing the client is not enough: the runner ships a PostgreSQL 16
          # client at /usr/bin/pg_restore, and the new binaries land in a
          # versioned directory that is not on PATH. Without this, validation
          # runs v16 against a v18 archive and rejects a perfectly good backup.
          # GITHUB_PATH applies to subsequent steps, so the assertion follows.
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Verify the validator can read PostgreSQL 18 archives
        if: steps.mode.outputs.backup == 'true'
        run: |
          resolved="$(command -v pg_restore)"
          version="$(pg_restore --version | awk '{print $3}' | cut -d. -f1)"
          echo "pg_restore: $resolved (major $version)"
          if [ "$version" -lt 18 ]; then
            echo "::error::pg_restore $version cannot inspect a PostgreSQL 18 archive." \
              "Backup validation would reject a valid dump. Check PATH ordering." >&2
            exit 1
          fi

      - name: Create, upload, and retain production backup
        id: backup
        if: steps.mode.outputs.backup == 'true'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          install -d -m 700 .maintenance
          backup_name="nba-db-production-${SEASON}-$(date -u +%Y%m%dT%H%M%SZ).dump"
          manifest_sha256="$(curl --fail --silent --show-error \
            "${LIVE_API_URL}/api/dataset-status?season=${SEASON}" | jq -er '.manifest_sha256')"
          docker run --rm \
            --env PRODUCTION_DATABASE_URL \
            --env BACKUP_NAME="$backup_name" \
            --volume "$PWD/.maintenance:/backups" \
            postgres:18-bookworm \
            sh -c 'pg_dump --format=custom --no-owner --no-acl --file="/backups/${BACKUP_NAME}" "$PRODUCTION_DATABASE_URL"'
          uv run --locked --no-dev --extra ops python scripts/upload_backup.py \
            --season "$SEASON" \
            --backup-file ".maintenance/$backup_name" \
            --manifest-sha256 "$manifest_sha256" \
            --retention-days 30 \
            --minimum-copies 7

      - name: Download newest verified backup
        id: download
        if: steps.mode.outputs.restore == 'true'
        run: |
          set -euo pipefail
          install -d -m 700 .maintenance
          uv run --locked --no-dev --extra ops python scripts/download_backup.py \
            --season "$SEASON" \
            --output-file .maintenance/latest.dump
          # The receipt carries the object key and the manifest digest recorded
          # on the object. The drill compares that digest against the restored
          # data; recording a proven copy needs the key. Re-deriving either with
          # a second listing could pick a different object than the one restored.
          receipt=.maintenance/latest.dump.json
          echo "manifest=$(jq -er '.manifest_sha256' "$receipt")" >> "$GITHUB_OUTPUT"
          echo "key=$(jq -er '.key' "$receipt")" >> "$GITHUB_OUTPUT"

      - name: Restore and prove servable in isolated PostgreSQL 18
        id: restore
        if: steps.mode.outputs.restore == 'true'
        uses: dagger/dagger-for-github@v8.4.0
        with:
          version: "0.21.7"
          verb: call
          args: >-
            restore-backup
            --backup=.maintenance/latest.dump
            --season=2025-26
            --manifest-sha256=${{ steps.download.outputs.manifest }}
            --source=.

      - name: Record the proven backup
        id: record
        if: steps.mode.outputs.restore == 'true' && steps.restore.outcome == 'success'
        run: |
          set -euo pipefail
          uv run --locked --no-dev --extra ops python scripts/record_proven_backup.py \
            --season "$SEASON" \
            --key "${{ steps.download.outputs.key }}"

      # Alert state is keyed to the operation, not to the workflow. The two
      # schedules run different operations, so a single shared issue title let
      # a successful backup close a failed restore drill's alert -- and the
      # close comment asserted a resolution that had not happened. The next
      # restore signal is a month away, so that silence is expensive.
      #
      # These steps need the checkout above, so a job that dies before it
      # reconciles nothing. That gap is covered from outside: production-watch
      # asserts backup freshness on its own schedule, so a maintenance run that
      # fails this early still surfaces within the maximum backup age.
      - name: Reconcile backup alert
        if: always() && steps.mode.outputs.backup == 'true'
        uses: ./.github/actions/reconcile-alert
        with:
          title: Production backup failed
          passed: ${{ steps.backup.outcome == 'success' }}
          token: ${{ github.token }}

      - name: Reconcile restore drill alert
        if: always() && steps.mode.outputs.restore == 'true'
        uses: ./.github/actions/reconcile-alert
        with:
          title: Production restore drill failed
          passed: ${{ steps.download.outcome == 'success' && steps.restore.outcome == 'success' && steps.record.outcome == 'success' }}
          token: ${{ github.token }}
